<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ранкове читання</title>
<meta name="theme-color" content="#0b0b0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ранок">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root {
  --black: #0b0b0c; --panel: #151517; --panel-2: #1d1d20; --line: #2a2a2e;
  --red: #e3121b; --red-deep: #a80d14; --red-soft: rgba(227,18,27,.14);
  --white: #f5f3f0; --muted: #9b9a9e; --gold: #d8b25a;
  --stripes: repeating-linear-gradient(90deg, var(--red) 0 14px, #000 14px 28px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--black); color: var(--white);
  font: 17px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; cursor: pointer; }
img { display: block; }

/* ---------- header ---------- */
.stripes { height: 6px; background: var(--stripes); }
header.top { padding: calc(env(safe-area-inset-top) + 14px) 18px 6px; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.brand h1 { margin: 0; font-size: 34px; font-weight: 850; letter-spacing: -0.03em; line-height: 1; }
.brand h1 span { color: var(--red); }
.date { color: var(--muted); font-size: 14px; text-align: right; }
.date::first-letter { text-transform: uppercase; }
.stats { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; font-size: 13px; color: var(--muted); }
.stat b { color: var(--white); font-weight: 700; }

nav.chips { position: sticky; top: 0; z-index: 10; background: rgba(11,11,12,.92);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  padding: calc(env(safe-area-inset-top) * 0 + 10px) 0 10px; border-bottom: 1px solid var(--line); }
.chips-row { display: flex; gap: 8px; overflow-x: auto; padding: 0 18px; scrollbar-width: none; }
.chips-row::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--panel); border-radius: 999px;
  padding: 7px 14px; font-size: 14px; font-weight: 600; color: var(--white); }
.chip.on { background: var(--red); border-color: var(--red); }
.chip .n { opacity: .6; font-weight: 500; margin-left: 4px; }

main { padding: 6px 18px calc(env(safe-area-inset-bottom) + 50px); max-width: 760px; margin: 0 auto; }
h2.day { display: flex; align-items: center; gap: 10px; font-size: 13px; letter-spacing: .14em;
  text-transform: uppercase; color: var(--muted); margin: 26px 0 12px; }
h2.day::after { content: ""; flex: 1; height: 1px; background: var(--line); }

/* ---------- media fallback ---------- */
.media { position: relative; overflow: hidden; background: var(--panel-2); }
.media img { width: 100%; height: 100%; object-fit: cover; }
.ph { position: absolute; inset: 0; display: grid; place-items: center;
  background: repeating-linear-gradient(90deg, var(--red-deep) 0 22px, #050505 22px 44px); }
.ph span { background: rgba(0,0,0,.72); padding: 6px 12px; border-radius: 8px; font-weight: 800; font-size: 15px; letter-spacing: .02em; }

.tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 800;
  letter-spacing: .08em; text-transform: uppercase; color: var(--red); }
.tag::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--red); }
.meta { color: var(--muted); font-size: 13px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.dot { opacity: .5; }

/* ---------- hero ---------- */
.hero { display: block; width: 100%; text-align: left; border: 0; padding: 0; background: var(--panel);
  border-radius: 20px; overflow: hidden; margin-bottom: 14px; position: relative; }
.hero .media { aspect-ratio: 16/10; }
.hero .over { position: absolute; inset: auto 0 0 0; padding: 70px 18px 18px;
  background: linear-gradient(to top, rgba(0,0,0,.95) 30%, rgba(0,0,0,.6) 70%, transparent); }
.hero .title { font-size: 24px; font-weight: 800; line-height: 1.2; margin: 8px 0 6px; letter-spacing: -0.01em; }
.hero .lead { color: #d8d6d3; font-size: 15px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.badge-top { display: inline-block; margin-right: 8px; background: var(--red); color: #fff; font-size: 12px;
  font-weight: 800; letter-spacing: .08em; text-transform: uppercase; padding: 5px 10px; border-radius: 6px; }

/* ---------- cards ---------- */
.card { display: grid; grid-template-columns: 1fr 104px; gap: 14px; width: 100%; text-align: left;
  background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 10px; }
.card .media { width: 104px; height: 104px; border-radius: 12px; }
.card .ph span { font-size: 11px; padding: 4px 7px; }
.card .title { font-size: 17px; font-weight: 750; line-height: 1.28; margin: 5px 0 6px;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.read .title, .read .lead { color: var(--muted); }
.read .media { opacity: .45; }
.read .tag { color: var(--muted); } .read .tag::before { background: var(--muted); }

.empty { text-align: center; color: var(--muted); padding: 70px 10px; }
.empty b { color: var(--white); display: block; font-size: 20px; margin-bottom: 6px; }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 16px; color: var(--muted); font-size: 13px; }
.linkbtn { border: 0; background: none; color: var(--red); font-weight: 700; font-size: 14px; padding: 6px 0; }

/* ---------- reader ---------- */
.reader { position: fixed; inset: 0; z-index: 50; background: var(--black); overflow-y: auto;
  -webkit-overflow-scrolling: touch; transform: translateX(100%); transition: transform .28s cubic-bezier(.2,.8,.2,1); }
.reader.open { transform: none; }
.rbar { position: sticky; top: 0; z-index: 2; display: flex; justify-content: space-between; align-items: center;
  padding: calc(env(safe-area-inset-top) + 8px) 12px 8px; background: rgba(11,11,12,.9);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
.back { border: 0; background: var(--panel); border-radius: 999px; padding: 8px 14px 8px 10px; font-weight: 700; font-size: 15px; display: flex; gap: 4px; align-items: center; }
.back svg { width: 18px; height: 18px; }
.rbar .stripes-mini { width: 56px; height: 14px; border-radius: 3px; background: var(--stripes); background-size: 28px 100%; }
.rimg { aspect-ratio: 16/9; }
.rbody { padding: 18px 20px calc(env(safe-area-inset-bottom) + 40px); max-width: 700px; margin: 0 auto; }
.rbody h1 { font-size: 27px; line-height: 1.18; margin: 10px 0 10px; font-weight: 850; letter-spacing: -0.015em; }
.rlead { font-size: 19px; line-height: 1.45; font-weight: 600; color: #fff; margin: 16px 0;
  padding-left: 14px; border-left: 4px solid var(--red); }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin: 18px 0; }
.box h3 { margin: 0 0 8px; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--red); }
.box ul { margin: 0; padding-left: 20px; }
.box li { margin: 6px 0; }
.box li::marker { color: var(--red); }
.rbody p { font-size: 18px; line-height: 1.62; margin: 0 0 16px; color: #e8e6e3; }
.why { background: linear-gradient(135deg, var(--red-soft), transparent); border-color: rgba(227,18,27,.35); }
.orig { display: flex; justify-content: center; align-items: center; gap: 8px; width: 100%; margin-top: 22px;
  border: 1px solid var(--line); background: var(--panel); color: var(--white); text-decoration: none;
  border-radius: 14px; padding: 14px; font-weight: 700; }
.note { color: var(--muted); font-size: 13px; margin-top: 12px; text-align: center; }
</style>
</head>
<body>
<div class="stripes"></div>
<header class="top">
  <div class="brand"><h1>Ранок<span>.</span></h1><div class="date" id="today"></div></div>
  <div class="stats" id="stats"></div>
</header>
<nav class="chips"><div class="chips-row" id="chips"></div></nav>
<main id="list"></main>

<section class="reader" id="reader" aria-hidden="true">
  <div class="rbar">
    <button class="back" id="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>Назад</button>
    <div class="stripes-mini"></div>
  </div>
  <div id="rcontent"></div>
</section>

<script>
const READ_KEY = 'ranok-read';
const LANGS = { en: 'англійською', it: 'італійською', uk: 'українською', de: 'німецькою', fr: 'французькою', es: 'іспанською', pl: 'польською' };
let data = { days: [] }, topic = 'Усі', unreadOnly = false, flat = [];

const store = {
  get() { try { return new Set(JSON.parse(localStorage.getItem(READ_KEY) || '[]')); } catch { return new Set(); } },
  set(s) { try { localStorage.setItem(READ_KEY, JSON.stringify([...s].slice(-2000))); } catch {} }
};
let read = store.get();

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function dayLabel(iso) {
  const d = new Date(iso + 'T12:00:00'), t = new Date(); t.setHours(12,0,0,0);
  const diff = Math.round((t - d) / 864e5);
  if (diff === 0) return 'Сьогодні';
  if (diff === 1) return 'Вчора';
  return d.toLocaleDateString('uk-UA', { weekday: 'long', day: 'numeric', month: 'long' });
}
function media(a, cls = '') {
  const ph = `<div class="ph"><span>${esc(a.topic || 'Ранок')}</span></div>`;
  if (!a.image) return `<div class="media ${cls}">${ph}</div>`;
  return `<div class="media ${cls}">${ph}<img src="${esc(a.image)}" alt="" loading="lazy" referrerpolicy="no-referrer"
    onload="this.previousElementSibling.remove()" onerror="this.remove()"></div>`;
}
const mins = a => a.readMinutes ? `${a.readMinutes} хв` : '';
const metaLine = a => [esc(a.source), mins(a)].filter(Boolean).join('<span class="dot">•</span>');

function render() {
  flat = data.days.flatMap(d => d.articles.map(a => ({ ...a, date: d.date })));
  const counts = {};
  flat.forEach(a => { counts[a.topic] = (counts[a.topic] || 0) + 1; });
  const topics = ['Усі', ...Object.keys(counts)];
  document.getElementById('chips').innerHTML =
    topics.map(t => `<button class="chip ${t === topic ? 'on' : ''}" data-t="${esc(t)}">${esc(t)}${t !== 'Усі' ? `<span class="n">${counts[t]}</span>` : ''}</button>`).join('') +
    `<button class="chip ${unreadOnly ? 'on' : ''}" data-u="1">Непрочитані</button>`;

  const unread = flat.filter(a => !read.has(a.url)).length;
  document.getElementById('stats').innerHTML = flat.length
    ? `<span class="stat"><b>${flat.length}</b> статей</span><span class="stat"><b>${unread}</b> непрочитаних</span><span class="stat"><b>${Object.keys(counts).length}</b> рубрик</span>`
    : `<span class="stat">Чекаю на перший випуск</span>`;

  let html = '', heroDone = false;
  for (const day of data.days) {
    const arts = day.articles.filter(a => (topic === 'Усі' || a.topic === topic) && (!unreadOnly || !read.has(a.url)));
    if (!arts.length) continue;
    html += `<h2 class="day">${esc(dayLabel(day.date))}</h2>`;
    arts.forEach(a => {
      const i = flat.findIndex(f => f.url === a.url);
      const isRead = read.has(a.url);
      if (!heroDone && !isRead) {
        heroDone = true;
        html += `<button class="hero" data-i="${i}">${media(a)}
          <div class="over"><span class="badge-top">Головне</span> <span class="tag">${esc(a.topic)}</span><div class="title">${esc(a.title)}</div>
          <div class="lead">${esc(a.lead || a.summary)}</div></div></button>`;
      } else {
        html += `<button class="card ${isRead ? 'read' : ''}" data-i="${i}"><div>
          <span class="tag">${esc(a.topic)}</span><div class="title">${esc(a.title)}</div>
          <div class="meta">${metaLine(a)}</div></div>${media(a)}</button>`;
      }
    });
  }
  const list = document.getElementById('list');
  list.innerHTML = html || `<div class="empty"><b>Поки що порожньо</b>Свіжі статті з'являться о 7:00.</div>`;
  if (html) list.insertAdjacentHTML('beforeend', `<div class="foot"><span>Оновлено ${esc(data.updated ? new Date(data.updated).toLocaleString('uk-UA', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '—')}</span><button class="linkbtn" id="allread">Усе прочитано</button></div>`);
}

function openReader(i, push = true) {
  const a = flat[i]; if (!a) return;
  read.add(a.url); store.set(read);
  const langNote = a.lang && a.lang !== 'uk' ? `Оригінал ${LANGS[a.lang] || a.lang.toUpperCase()}` : 'Оригінал';
  const body = Array.isArray(a.body) && a.body.length ? a.body : [a.summary];
  document.getElementById('rcontent').innerHTML = `
    ${media(a, 'rimg')}
    <article class="rbody">
      <span class="tag">${esc(a.topic)}</span>
      <h1>${esc(a.title)}</h1>
      <div class="meta">${esc(a.source)}<span class="dot">•</span>${esc(dayLabel(a.date))}${a.readMinutes ? `<span class="dot">•</span>${a.readMinutes} хв читання` : ''}</div>
      ${a.lead ? `<div class="rlead">${esc(a.lead)}</div>` : ''}
      ${Array.isArray(a.keyPoints) && a.keyPoints.length ? `<div class="box"><h3>Головне</h3><ul>${a.keyPoints.map(k => `<li>${esc(k)}</li>`).join('')}</ul></div>` : ''}
      ${body.map(p => `<p>${esc(p)}</p>`).join('')}
      ${a.whyItMatters ? `<div class="box why"><h3>Чому це важливо</h3>${esc(a.whyItMatters)}</div>` : ''}
      <a class="orig" href="${esc(a.url)}" target="_blank" rel="noopener">${esc(langNote)} ↗</a>
      <div class="note">Переказ українською підготовлено автоматично за матеріалом ${esc(a.source)}.</div>
    </article>`;
  const r = document.getElementById('reader');
  r.scrollTop = 0; r.classList.add('open'); r.setAttribute('aria-hidden', 'false');
  if (push) history.pushState({ i }, '', '#a' + i);
}
function closeReader() {
  const r = document.getElementById('reader');
  r.classList.remove('open'); r.setAttribute('aria-hidden', 'true');
  render();
}
window.addEventListener('popstate', e => { if (e.state && e.state.i != null) openReader(e.state.i, false); else closeReader(); });
document.getElementById('back').addEventListener('click', () => { if (history.state && history.state.i != null) history.back(); else closeReader(); });

document.addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (chip) { if (chip.dataset.u) unreadOnly = !unreadOnly; else topic = chip.dataset.t; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  const item = e.target.closest('[data-i]');
  if (item) { openReader(+item.dataset.i); return; }
  if (e.target.id === 'allread') { flat.forEach(a => read.add(a.url)); store.set(read); render(); }
});

async function load() {
  document.getElementById('today').textContent = new Date().toLocaleDateString('uk-UA', { weekday: 'long', day: 'numeric', month: 'long' });
  try {
    const r = await fetch('articles.json?t=' + Date.now(), { cache: 'no-store' });
    data = await r.json();
  } catch {}
  render();
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && !document.getElementById('reader').classList.contains('open')) load(); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
load();
</script>
</body>
</html>

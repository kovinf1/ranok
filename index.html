<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ранкове читання</title>
<meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ранок">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root {
  --bg: #f6f3ee; --card: #ffffff; --text: #1d1f23; --muted: #6b6f76;
  --line: #e4dfd6; --accent: #b4532a; --accent-soft: #f3e3d9; --read: #a3a6ab;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #16181c; --card: #1f2227; --text: #eceae6; --muted: #9a9ea6;
    --line: #2e3238; --accent: #e0875c; --accent-soft: #3a2a22; --read: #5f636a; }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text);
  font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-text-size-adjust: 100%; }
header { position: sticky; top: 0; z-index: 5; background: var(--bg);
  padding: calc(env(safe-area-inset-top) + 14px) 16px 10px; border-bottom: 1px solid var(--line); }
h1 { margin: 0; font-size: 28px; letter-spacing: -0.02em; }
.sub { color: var(--muted); font-size: 14px; margin-top: 2px; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--card); color: var(--text);
  border-radius: 999px; padding: 6px 13px; font-size: 14px; }
.chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
main { padding: 8px 16px calc(env(safe-area-inset-bottom) + 40px); max-width: 720px; margin: 0 auto; }
h2 { font-size: 15px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted);
  margin: 22px 0 10px; }
.card { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 14px;
  padding: 14px 15px; margin-bottom: 10px; color: inherit; text-decoration: none; }
.meta { font-size: 13px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.tag { background: var(--accent-soft); color: var(--accent); border-radius: 6px; padding: 1px 7px; font-weight: 600; }
.title { font-weight: 650; font-size: 18px; margin: 6px 0 4px; line-height: 1.3; }
.sum { color: var(--text); opacity: 0.88; font-size: 15.5px; }
.card.read .title, .card.read .sum { color: var(--read); }
.empty { text-align: center; color: var(--muted); padding: 60px 10px; }
.empty b { color: var(--text); display: block; font-size: 19px; margin-bottom: 6px; }
.bar { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
.btn { border: 0; background: none; color: var(--accent); font-size: 15px; padding: 4px 0; }
</style>
</head>
<body>
<header>
  <h1>Ранкове читання</h1>
  <div class="sub" id="sub">Завантаження…</div>
  <div class="chips" id="chips"></div>
</header>
<main id="list"></main>

<script>
const READ_KEY = 'ranok-read';
let data = { days: [] }, topic = 'Усі', unreadOnly = false;

function loadRead() { try { return new Set(JSON.parse(localStorage.getItem(READ_KEY) || '[]')); } catch { return new Set(); } }
function saveRead(s) { try { localStorage.setItem(READ_KEY, JSON.stringify([...s].slice(-2000))); } catch {} }
let read = loadRead();

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function dayLabel(iso) {
  const d = new Date(iso + 'T12:00:00'), t = new Date(); t.setHours(12,0,0,0);
  const diff = Math.round((t - d) / 864e5);
  if (diff === 0) return 'Сьогодні';
  if (diff === 1) return 'Вчора';
  return d.toLocaleDateString('uk-UA', { weekday: 'long', day: 'numeric', month: 'long' });
}

function render() {
  const topics = ['Усі', ...new Set(data.days.flatMap(d => d.articles.map(a => a.topic)).filter(Boolean))];
  document.getElementById('chips').innerHTML =
    topics.map(t => `<button class="chip ${t === topic ? 'on' : ''}" data-t="${esc(t)}">${esc(t)}</button>`).join('') +
    `<button class="chip ${unreadOnly ? 'on' : ''}" data-u="1">Непрочитані</button>`;

  const list = document.getElementById('list');
  let html = '';
  for (const day of data.days) {
    const arts = day.articles.filter(a => (topic === 'Усі' || a.topic === topic) && (!unreadOnly || !read.has(a.url)));
    if (!arts.length) continue;
    html += `<h2>${esc(dayLabel(day.date))}</h2>`;
    for (const a of arts) {
      html += `<a class="card ${read.has(a.url) ? 'read' : ''}" href="${esc(a.url)}" target="_blank" rel="noopener" data-url="${esc(a.url)}">
        <div class="meta">${a.topic ? `<span class="tag">${esc(a.topic)}</span>` : ''}<span>${esc(a.source)}</span>${a.lang && a.lang !== 'uk' ? `<span>· ${esc(a.lang.toUpperCase())}</span>` : ''}</div>
        <div class="title">${esc(a.title)}</div>
        <div class="sum">${esc(a.summary)}</div></a>`;
    }
  }
  list.innerHTML = html || `<div class="empty"><b>Поки що порожньо</b>Перші статті з'являться після найближчого ранкового випуску.</div>`;
  if (html) list.insertAdjacentHTML('beforeend', `<div class="bar"><span class="sub">Оновлено: ${esc(data.updated ? new Date(data.updated).toLocaleString('uk-UA') : '—')}</span><button class="btn" id="allread">Позначити все прочитаним</button></div>`);
}

document.addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (chip) { if (chip.dataset.u) unreadOnly = !unreadOnly; else topic = chip.dataset.t; render(); return; }
  const card = e.target.closest('.card');
  if (card) { read.add(card.dataset.url); saveRead(read); setTimeout(render, 300); }
  if (e.target.id === 'allread') { data.days.forEach(d => d.articles.forEach(a => read.add(a.url))); saveRead(read); render(); }
});

async function load() {
  try {
    const r = await fetch('articles.json?t=' + Date.now(), { cache: 'no-store' });
    data = await r.json();
    const today = data.days[0]?.articles.filter(a => !read.has(a.url)).length || 0;
    document.getElementById('sub').textContent = data.days.length
      ? `${dayLabel(data.days[0].date)}: ${data.days[0].articles.length} статей, непрочитаних ${today}` : 'Чекаю на перший випуск';
  } catch {
    document.getElementById('sub').textContent = 'Немає з’єднання, показую збережене';
  }
  render();
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
load();
</script>
</body>
</html>
